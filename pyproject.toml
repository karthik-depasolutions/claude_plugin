[project]
name = "mis-plugin-forge"
version = "0.1.0"
description = "MIS-to-Claude Plugin Generator Platform — root workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/forge-core",
    "packages/mcp-runtime",
    "apps/api",
]

[tool.uv.sources]
forge-core = { workspace = true }
mis-mcp-runtime = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy", "fixtures", "generated", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLC0415"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["legacy", "fixtures", "generated", "apps/web"]
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages/forge-core/tests", "packages/mcp-runtime/tests", "apps/api/tests", "tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"

[tool.uv]
package = false
