[project]
name = "forge-core"
version = "0.1.0"
description = "Data2plugin — core generator engine: ingestion, profiling, classification, binding, KPI compilation, generation, validation, packaging, publishing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "typer>=0.13.0",
    "rich>=13.9.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.0",
    "pyarrow>=17.0.0",
    "sqlglot>=25.0.0",
    "google-genai>=1.0.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.0",
    "mcp[cli]>=1.2.0",
    "PyGithub>=2.4.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "ddgs>=9.0.0",
    "langgraph-checkpoint-sqlite>=3.0.1",
]

[project.scripts]
forge = "forge_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_core"]
