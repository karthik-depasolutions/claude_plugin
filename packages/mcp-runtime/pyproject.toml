[project]
name = "mis-mcp-runtime"
version = "0.1.0"
description = "Generic, config-driven MCP server that powers every generated MIS plugin. One implementation, many customers — behavior comes entirely from config/*.json."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.0",
    "pyarrow>=17.0.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.9.0",
]

[project.scripts]
mis-mcp-runtime = "mis_mcp_runtime.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mis_mcp_runtime"]
