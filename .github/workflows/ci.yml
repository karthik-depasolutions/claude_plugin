name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Exercises forge_core.ingestion.postgres for real instead of skipping
      # (test_postgres_adapter.py skips cleanly when this isn't reachable).
      FORGE_TEST_POSTGRES_URL: postgresql://forge:forge@localhost:5432/forge
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install workspace
        run: uv sync --all-packages --dev

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy packages/forge-core/src packages/mcp-runtime/src apps/api/src

      - name: Pytest
        run: uv run pytest --cov=forge_core --cov=mis_mcp_runtime --cov=forge_api --cov-report=term-missing

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
