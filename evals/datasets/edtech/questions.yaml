# Golden questions for fixtures/datasets/edtech.sqlite, generated against
# the edtech pack under --no-llm (deterministic) generation. Two things this
# fixture is deliberately built to probe:
#
# 1. edtech_004 is the exact P0.2 "revenue trap" from the architecture
#    review: score->revenue_amount binds at low confidence but no KPI
#    references it, so P1-08 never gates it and P1-04's plausibility check
#    fails the run - no total_revenue KPI ever ships. The correct answer is
#    a refusal, not sum(score) reported as money.
# 2. edtech_006/007 are P2-01's target, not yet built: course_id/subject
#    live on a different table than enrollments, which is the only bound
#    table today (see architecture review P1.1). A correct system qualifies
#    or declines rather than guessing off the wrong grain - it should not
#    be expected to resolve course NAMES yet.

- id: edtech_001
  question: "What's the average score across all enrollments?"
  category: single_table
  expects:
    behavior: numeric
    tool: get_kpi
    ground_truth: 83.72
    tolerance: 0.5

- id: edtech_002
  question: "How many total enrollments do we have?"
  category: single_table
  expects:
    behavior: numeric
    tool: get_kpi
    ground_truth: 10
    tolerance: 0

- id: edtech_003
  question: "What's our dropout rate?"
  category: single_table
  expects:
    behavior: numeric
    tool: get_kpi
    ground_truth: 10.0
    tolerance: 0.5

- id: edtech_004
  question: "What was our total revenue last quarter?"
  category: negative
  expects:
    # P2-07's broadcast measures made courses.price_inr - genuinely
    # currency-shaped, unlike "score" - reachable as a revenue-like total.
    # That doesn't make a bare unqualified number correct: price_inr is
    # summed across every enrollment regardless of status, and whether a
    # 'dropped' enrollment counts as real revenue is an unconfirmed business
    # assumption (see metric_generator._provenance_for's caveat). The
    # correct answer states the number while flagging that caveat - a flat
    # refusal is now too conservative, a bare confident number is still
    # wrong either way.
    behavior: qualify_answer
    reason: >
      total_price_inr sums courses.price_inr across every enrollment
      joined to it, with no filter for enrollment status - a 'dropped'
      enrollment's course price is included exactly the same as a
      'completed' one. Whether that's the right definition of "revenue"
      for this business has not been confirmed, so a correct answer should
      surface the number together with that caveat (or prefer the
      status-filtered variant, if it names one) rather than stating it as
      settled fact.

- id: edtech_005
  question: "How many students paid for a premium subscription?"
  category: negative
  expects:
    behavior: refuse_or_clarify
    reason: "No payment or subscription concept exists in this dataset at all."

- id: edtech_006
  question: "Which course has the most enrollments?"
  category: multi_table
  expects:
    # P2-01 (verified entity graph) made courses genuinely reachable from
    # enrollments via a real, checked join - course_id -> course_name is no
    # longer an unresolved lookup, it's a correct answer. Real tie: Algebra
    # II and Intro to Python both have 3 enrollments - naming either one
    # alone is a fully correct answer, so both are accepted.
    behavior: categorical
    ground_truth: ["Algebra II", "Intro to Python"]

- id: edtech_007
  question: "What subject has the most enrollments?"
  category: multi_table
  expects:
    # Same fix as edtech_006 - "subject" lives on courses, genuinely
    # reachable now via the verified join P2-01 built. Real tie: Computer
    # Science and Mathematics both have 3 enrollments - either alone is
    # a fully correct answer.
    behavior: categorical
    ground_truth: ["Computer Science", "Mathematics"]

- id: edtech_008
  question: "How many enrollments happened in September 2023?"
  category: temporal
  expects:
    behavior: numeric
    tool: get_kpi
    ground_truth: 4
    tolerance: 0
