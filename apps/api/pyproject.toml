[project]
name = "forge-api"
version = "0.1.0"
description = "MIS Plugin Forge — FastAPI orchestration service: run management, SSE progress, artifact download"
requires-python = ">=3.11"
dependencies = [
    "forge-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "mis-mcp-runtime",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2.0"]

[project.scripts]
forge-api = "forge_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_api"]
